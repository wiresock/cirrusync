[package]
name = "cirrusync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Cirrusync contributors"]
description = "A small, auditable Cloudflare Dynamic DNS client"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wiresock/cirrusync"
keywords = ["cloudflare", "ddns", "dns", "daemon"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.15"
# 0.6.5 uses let-chain syntax stabilized after the crate's Rust 1.85 MSRV.
wiremock = "=0.6.4"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
