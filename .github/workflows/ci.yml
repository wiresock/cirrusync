name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stable-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

  compatibility:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 / stable
            os: ubuntu-22.04
            toolchain: stable
          - name: Ubuntu 24.04 ARM64 / stable
            os: ubuntu-24.04-arm
            toolchain: stable
          - name: Windows 2022 / stable
            os: windows-2022
            toolchain: stable
          - name: Ubuntu 22.04 / Rust 1.85 MSRV
            os: ubuntu-22.04
            toolchain: "1.85.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Cache Cargo data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --all-features --locked

  shell:
    name: Installer syntax and ShellCheck
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: |
          bash -n bootstrap.sh
          bash -n tests/bootstrap_static.sh
          bash -n tests/bootstrap_functions.sh
          bash -n tests/bootstrap_fsmonitor_probe.sh
          bash -n tests/bootstrap_lifecycle.sh

      - name: Check bootstrap installer
        run: >-
          shellcheck --severity=warning
          bootstrap.sh
          tests/bootstrap_static.sh
          tests/bootstrap_functions.sh
          tests/bootstrap_fsmonitor_probe.sh
          tests/bootstrap_lifecycle.sh

      - name: Check installer invariants and behavior
        run: |
          bash tests/bootstrap_static.sh
          bash tests/bootstrap_functions.sh

  installer-debian:
    name: Installer validation (Debian 12)
    runs-on: ubuntu-24.04
    container: debian:12-slim
    timeout-minutes: 10
    steps:
      - name: Install validation tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            acl \
            ca-certificates \
            git \
            passwd \
            procps \
            shellcheck \
            systemd \
            util-linux

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate scripts on Debian
        run: |
          bash -n bootstrap.sh
          bash -n tests/bootstrap_static.sh
          bash -n tests/bootstrap_functions.sh
          bash -n tests/bootstrap_fsmonitor_probe.sh
          bash -n tests/bootstrap_lifecycle.sh
          shellcheck --severity=warning \
            bootstrap.sh \
            tests/bootstrap_static.sh \
            tests/bootstrap_functions.sh \
            tests/bootstrap_fsmonitor_probe.sh \
            tests/bootstrap_lifecycle.sh
          bash tests/bootstrap_static.sh
          bash tests/bootstrap_functions.sh

      - name: Verify the systemd unit
        run: |
          groupadd --system cirrusync
          useradd --system \
            --gid cirrusync \
            --home-dir /var/lib/cirrusync \
            --shell /usr/sbin/nologin \
            cirrusync
          install -d -o root -g cirrusync -m 0750 /etc/cirrusync
          install -d -o cirrusync -g cirrusync -m 0750 /var/lib/cirrusync
          install -o root -g root -m 0755 /bin/true /usr/local/bin/cirrusync
          systemd-analyze verify systemd/cirrusync.service

  installer-lifecycle:
    name: Privileged installer lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acl ca-certificates openssl python3

      - name: Exercise the real installer lifecycle
        run: bash tests/bootstrap_lifecycle.sh
